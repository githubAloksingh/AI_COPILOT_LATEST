spring:
  application:
    name: ai-work-copilot
  
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/ai_work_copilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:50}MB
      max-request-size: ${MAX_FILE_SIZE_MB:50}MB

server:
  port: 8080

logging:
  level:
    com.example.copilot: INFO
    org.springframework.ai: INFO

copilot:
  frontend-url: ${FRONTEND_URL:https://ai-copilot-8ofm.onrender.com}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

