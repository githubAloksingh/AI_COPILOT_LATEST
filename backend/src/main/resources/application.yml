spring:
  application:
    name: ai-work-copilot
  
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/ai_work_copilot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:NEwgen@220205}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:50}MB
      max-request-size: ${MAX_FILE_SIZE_MB:50}MB

server:
  port: 8080

logging:
  level:
    com.example.copilot: INFO
    org.springframework.ai: INFO

copilot:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
