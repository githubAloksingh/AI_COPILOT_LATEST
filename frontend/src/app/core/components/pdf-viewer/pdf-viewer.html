<div class="modal-backdrop" *ngIf="visible" (click)="close()">
  <div class="pdf-viewer-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="title-wrap">
        <span class="document-icon">📄</span>
        <h3>{{ documentName }}</h3>
      </div>
      <div class="header-actions">
        <button *ngIf="previewBlobUrl" type="button" class="open-tab-button" (click)="openInNewTab()" title="Open in Full Browser Tab">
          ↗ Open in New Tab
        </button>
        <button type="button" class="close-button" (click)="close()" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="modal-body">
      <div *ngIf="loading" class="loading-state">
        <div class="spinner"></div>
        <span>Retrieving exact original PDF binary from server...</span>
      </div>
      <div *ngIf="error && !loading" class="error-state">
        <div class="error-icon">⚠️</div>
        <p>{{ error }}</p>
      </div>
      <div *ngIf="spreadsheetHtml && !loading" class="spreadsheet-preview-container" [innerHTML]="spreadsheetHtml"></div>
      <pre *ngIf="csvText && !loading" class="csv-preview-text">{{ csvText }}</pre>
      <iframe *ngIf="previewPdfUrl && !loading && !spreadsheetHtml && !csvText" [src]="previewPdfUrl" type="application/pdf" title="Original PDF Document"></iframe>
    </div>

    <div class="modal-footer">
      <span>Showing exact uploaded PDF file (unparsed binary)</span>
      <div class="footer-actions">
        <div class="download-popup-wrapper" (click)="$event.stopPropagation()">
          <button type="button" class="download-footer-button" (click)="onDownloadClick($event)">Download</button>
          <div class="download-format-popup" *ngIf="showDownloadMenu">
            <button type="button" class="download-format-option" (click)="handleDownloadOption('excel', $event)">
              <svg class="option-icon excel-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="8" y1="13" x2="16" y2="17"/>
                <line x1="16" y1="13" x2="8" y2="17"/>
              </svg>
              <span>Download as Excel</span>
            </button>
            <button type="button" class="download-format-option" (click)="handleDownloadOption('csv', $event)">
              <svg class="option-icon csv-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="8" y1="13" x2="16" y2="13"/>
                <line x1="8" y1="17" x2="16" y2="17"/>
              </svg>
              <span>Download as CSV</span>
            </button>
            <button type="button" class="download-format-option" (click)="handleDownloadOption('pdf', $event)">
              <svg class="option-icon pdf-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
              </svg>
              <span>Download as PDF</span>
            </button>
          </div>
        </div>
        <button type="button" class="close-footer-button" (click)="close()">Close</button>
      </div>
    </div>
  </div>
</div>
