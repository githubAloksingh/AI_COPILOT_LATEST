<div class="feature-history-section" *ngIf="projectId">
  <div class="history-card">
    <div class="history-card-header">
      <div class="header-title-wrap">
        <span class="history-icon">📜</span>
        <h3 class="history-title">HISTORY</h3>
      </div>
      <button type="button" class="btn-history-refresh" (click)="refresh()" [disabled]="loading" title="Refresh" aria-label="Refresh">
        🔄
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="history-loading">
      <div class="spinner-sm"></div>
      <span>Loading history for selected project...</span>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage && !loading" class="history-error">
      ⚠️ {{ errorMessage }}
    </div>

    <!-- No History Found -->
    <div *ngIf="!loading && !errorMessage && historyItems.length === 0" class="history-empty">
      <div class="empty-icon">📂</div>
      <p class="empty-text">No history found.</p>
    </div>

    <!-- History Table -->
    <div *ngIf="!loading && !errorMessage && historyItems.length > 0" class="history-table-wrap">
      <table class="history-table">
        <thead>
          <tr>
            <th class="col-sno">S.No</th>
            <th class="col-project">Project Name</th>
            <th class="col-doc">BRD / Codebase Name</th>
            <th class="col-version">Version</th>
            <th class="col-view">View</th>
            <th class="col-download">Download</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of historyItems; let i = index">
            <td class="col-sno">{{ i + 1 }}</td>
            <td class="col-project">
              <strong>{{ item.projectName }}</strong>
            </td>
            <td class="col-doc">
              <span class="doc-badge" [ngClass]="item.fileType === 'ZIP' ? 'badge-zip' : 'badge-brd'">
                {{ item.fileType === 'ZIP' ? '📦' : '📄' }}
              </span>
              <span class="doc-name">{{ item.documentName }}</span>
            </td>
            <td class="col-version">
              <span class="version-tag">{{ item.version || '1.0' }}</span>
            </td>
            <td class="col-view">
              <button 
                *ngIf="item.fileType !== 'ZIP'"
                type="button" 
                class="btn-action-icon btn-view" 
                (click)="viewDocument(item)" 
                title="View"
                aria-label="View">
                👁
              </button>
            </td>
            <td class="col-download">
              <button 
                type="button" 
                class="btn-action-icon btn-download" 
                (click)="downloadDocument(item)" 
                title="Download"
                aria-label="Download">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-pdf-viewer></app-pdf-viewer>
